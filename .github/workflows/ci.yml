name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-crypto-py-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-matrix:
    name: CPython ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Runtime
        run: python -VV

      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e .

      - name: Unit + conformance + API contract
        run: python -m unittest discover -s tests -v

      - name: Build wheel
        run: python -m pip wheel --no-deps --no-build-isolation -w dist .

      - name: Wheel smoke outside source tree
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          python -m pip install --no-deps --target "$tmp/site" dist/*.whl
          (
            cd "$tmp"
            PYTHONPATH="$tmp/site" python -c \
              'import cross_crypto_py as cc; assert cc.__version__ == "3.0.0rc4"; print(cc.__version__)'
          )

  os-smoke:
    name: ${{ matrix.os }} / CPython 3.14
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e .

      - name: Test
        run: python -m unittest discover -s tests -v
